<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captura de texto</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Captura de texto</h1><p>Digite no campo abaixo. O conteúdo é salvo automaticamente após uma breve pausa.</p><label for="texto">Texto</label><textarea id="texto" maxlength="10000" placeholder="Ex.: Oi, teste"></textarea><p id="status" role="status">Aguardando digitação...</p><h2>Registros salvos</h2><button id="atualizar" type="button">Atualizar histórico</button><ul id="historico"></ul></main><script src="app.js"></script></body></html>
