<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captura de texto</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Captura de texto</h1><p>Entre com seu e-mail para salvar textos no seu banco privado.</p><section id="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com"><button id="entrar">Enviar link de acesso</button><p id="auth-status" role="status"></p></section><section id="editor" hidden><p id="usuario"></p><button id="sair">Sair</button><label for="texto">Texto</label><textarea id="texto" maxlength="10000" placeholder="Oi, teste"></textarea><p id="status" role="status">Aguardando digitação...</p><h2>Histórico privado</h2><button id="atualizar">Atualizar</button><ul id="historico"></ul></section></main><script type="module" src="app.js"></script></body></html>
